# Elenco dei cinema da interrogare.
# type: "tickets18", "wp_remotefilm", "movieconnection", "fronte_del_porto", "space_cinema", "cinema_rex", "esperia", "piccolo"
# (vedi cartella scrapers/ per i dettagli)
cinemas:
  - name: "Cineplex (Due Carrare)"
    type: tickets18
    url: "https://pd.cineplexmoderno.cineplexmoderno.it/"
    website: "https://pd.cineplexmoderno.cineplexmoderno.it/"
    maps: "https://maps.app.goo.gl/8R96kqpPozFEq2VX7"
    enabled: true

  - name: "Multiastra"
    type: wp_remotefilm
    url: "https://multiastra.it/"
    website: "https://multiastra.it/"
    maps: "https://maps.app.goo.gl/Qkcv7jaFpzaJEtdE9"
    enabled: true

  - name: "Porto Astra"
    type: wp_remotefilm
    url: "https://portoastra.it/"
    website: "https://portoastra.it/"
    maps: "https://maps.app.goo.gl/b2ChRM56cKhe9n4s5"
    enabled: true

  - name: "Lux"
    type: movieconnection
    url: "https://www.movieconnection.it/lux/"
    website: "https://www.movieconnection.it/lux/"
    maps: "https://maps.app.goo.gl/qhsvemKB9kRhSaLh9"
    enabled: true

  - name: "Fronte del Porto"
    type: fronte_del_porto
    url: "https://www.frontedelportopadova.it/eventi/"
    website: "https://www.frontedelportopadova.it/eventi/"
    maps: "https://maps.app.goo.gl/tzxdgCAiJgBi42UQA"
    enabled: true

  # The Space (Limena): orari caricati via JavaScript e visibili un giorno
  # alla volta -> Playwright clicca i giorni uno per uno (scrapers/space_cinema.py).
  - name: "The Space (Limena)"
    type: space_cinema
    url: "https://www.thespacecinema.it/cinema/limena/al-cinema"
    website: "https://www.thespacecinema.it/cinema/limena/al-cinema"
    maps: "https://maps.app.goo.gl/RXyb6F8rpJD7JCAv5"
    # local_only: aggiornato a mano dal PC con run_space_only.py. I workflow in cloud
    # non lo scaricano e riprendono gli orari gia' salvati, cosi' non vengono cancellati.
    local_only: true
    enabled: true

  # Cinema Rex: la pagina scarica la programmazione da un JSON; lo scraper
  # legge quello (nessun browser) e solo se fallisce ripiega su Playwright.
  # Di default tiene solo i FILM (non teatro/concerti): vedi INCLUDE_CATEGORIES
  # in scrapers/cinema_rex.py.
  - name: "Cinema Rex"
    type: cinema_rex
    url: "https://www.cinemarex.it/"
    website: "https://www.cinemarex.it/"
    maps: "https://maps.app.goo.gl/RLrJP6tb8MTdoeZy5"
    enabled: true

  # Cinema Esperia: blog a schede in HTML statico, date e orari scritti a mano
  # nel sottotitolo ("VENERDI 2 Ottobre - ore 21.00, ...").
  - name: "Cinema Esperia"
    type: esperia
    url: "https://www.esperiapadova.it/Blog?category=1"
    website: "https://www.esperiapadova.it/"
    maps: "https://maps.app.goo.gl/VxPvYrDH7SH18gcL9"
    enabled: true

  # Piccolo Teatro: WordPress; tiene SOLO gli articoli di categoria "cinema"
  # (teatro, musica, lirica ecc. scartati - vedi INCLUDE_CATEGORIES in scrapers/piccolo.py).
  - name: "Piccolo Teatro"
    type: piccolo
    url: "https://www.piccolo-padova.it/"
    website: "https://www.piccolo-padova.it/"
    maps: "https://maps.app.goo.gl/uFBnbftEX8gbHocEA"
    enabled: true

# Chiave API TMDB (opzionale ma consigliata) per completare regista/durata/
# locandina/trailer quando il sito del cinema non li fornisce gia'.
# In GitHub Actions viene passata come variabile d'ambiente TMDB_API_KEY
# (vedi README); questo campo serve solo come comodo fallback per test in locale.
tmdb_api_key: null
