# Elenco dei cinema da interrogare.
# type: "tickets18", "wp_remotefilm", "movieconnection", "playwright", "cinema_rex"
# (vedi cartella scrapers/ per i dettagli)
cinemas:
  - name: "Cineplex Moderno (Due Carrare)"
    type: playwright
    url: "https://pd.cineplexmoderno.cineplexmoderno.it/"
    enabled: true

  - name: "Multiastra"
    type: wp_remotefilm
    url: "https://multiastra.it/"
    enabled: true

  - name: "Porto Astra"
    type: wp_remotefilm
    url: "https://portoastra.it/"
    enabled: true

  - name: "MovieConnection (il Lux)"
    type: movieconnection
    url: "https://www.movieconnection.it/lux/"
    enabled: true

  - name: "Fronte del Porto Padova"
    type: fronte_del_porto
    url: "https://www.frontedelportopadova.it/eventi/"
    enabled: true

  # Disabilitati per default: richiedono Playwright
  # per abilitarli, aggiungi "pip install playwright" e "playwright install" al workflow.
  # Vedi README > Sezione GitHub Actions per i dettagli.

  - name: "The Space Cinema (Limena)"
    type: playwright
    url: "https://www.thespacecinema.it/cinema/limena/al-cinema"
    enabled: false

  - name: "Cinema Rex"
    type: cinema_rex
    url: "https://www.cinemarex.it/"
    enabled: false

  # Non incluso per policy (il sito vieta esplicitamente l'accesso automatico):
  # - Fronte del Porto Padova

# Chiave API TMDB (opzionale ma consigliata) per completare regista/durata/
# locandina/trailer quando il sito del cinema non li fornisce gia'.
# In GitHub Actions viene passata come variabile d'ambiente TMDB_API_KEY
# (vedi README); questo campo serve solo come comodo fallback per test in locale.
tmdb_api_key: null
