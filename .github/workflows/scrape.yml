name: Aggiorna programmazione cinema

# Niente "schedule" qui: il giro quotidiano lo lancia orchestrator.yml, in
# sequenza con gli eventi. Un cron in piu' qui creava run concorrenti.
on:
  workflow_dispatch: {}

# Un solo workflow alla volta tra quelli che scrivono docs/ (questo, check-events):
# evita push simultanei e conflitti su docs/index.html e data.json.
concurrency:
  group: cinema-docs-update
  cancel-in-progress: false

permissions:
  contents: write
  issues: write   # per leggere le issue "evento" e chiudere quelle passate

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Installa dipendenze (incluso Playwright per Space Cinema/Rex)
        run: |
          pip install -r requirements.txt
          pip install playwright
          playwright install --with-deps chromium

      - name: Esegui lo scraper e genera la pagina
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py

      - name: Pubblica la pagina aggiornata (commit di docs/)
        run: |
          git config user.name "cinema-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git diff --quiet --cached || git commit -m "Aggiorna programmazione $(date -u +'%Y-%m-%d %H:%M UTC')"
          # docs/ e' generato: in caso di conflitto vince la versione appena creata
          for i in 1 2 3; do
            # se un tentativo precedente ha lasciato un rebase a meta', lo annulla
            git rebase --abort 2>/dev/null || true
            if git pull --rebase --autostash -X theirs && git push; then exit 0; fi
            echo "push non riuscito, nuovo tentativo ($i/3)"; sleep 10
          done
          exit 1
 
