name: Aggiorna programmazione cinema

on:
  workflow_dispatch: {}
  schedule:
    # GitHub Actions usa cron in UTC e non gestisce l'ora legale italiana:
    # due righe per avvicinarsi comunque alle 14:30 locali tutto l'anno.
    # Nei giorni di cambio ora (fine marzo / fine ottobre) puo' esserci
    # fino a un'ora di scarto per qualche giorno: non e' un bug, e' un
    # limite di cron. Se preferisci un solo orario fisso, tieni solo una
    # delle due righe.
    - cron: "30 12 4-10 * *"     # ~14:30 CEST (ora legale, aprile-ottobre)
    - cron: "30 13 1-3,11-12 * *" # ~14:30 CET (ora solare, nov-marzo)

permissions:
  contents: write
  issues: write   # per leggere le issue "evento" e chiudere quelle passate

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Installa dipendenze (incluso Playwright per Space Cinema/Rex)
        run: |
          pip install -r requirements.txt
          pip install playwright
          playwright install --with-deps chromium

      - name: Esegui lo scraper e genera la pagina
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py

      - name: Pubblica la pagina aggiornata (commit di docs/)
        run: |
          git config user.name "cinema-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git diff --quiet --cached || git commit -m "Aggiorna programmazione $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash || true
          git push
