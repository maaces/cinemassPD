name: Orchestrator - Esegui tutte le Actions in sequenza

on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * *'  # 14:30 ora italiana

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: 1️⃣ Trigger pages-build-deployment
        run: |
          gh workflow run pages-build-deployment.yml --ref main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ⏳ Aspetta pages-build-deployment
        run: |
          for i in {1..60}; do
            STATUS=$(gh run list --workflow pages-build-deployment.yml --limit 1 --json status --jq '.[0].status')
            if [ "$STATUS" = "completed" ]; then
              echo "✅ pages-build-deployment completato!"
              break
            fi
            echo "In attesa... tentativo $i/60"
            sleep 10
          done

      - name: 2️⃣ Trigger Controlla nuovi eventi personalizzati
        run: |
          gh workflow run check-events.yml --ref main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ⏳ Aspetta Controlla nuovi eventi
        run: |
          for i in {1..60}; do
            STATUS=$(gh run list --workflow check-events.yml --limit 1 --json status --jq '.[0].status')
            if [ "$STATUS" = "completed" ]; then
              echo "✅ Controlla nuovi eventi completato!"
              break
            fi
            echo "In attesa... tentativo $i/60"
            sleep 10
          done

      - name: 3️⃣ Trigger Aggiorna programmazione cinema
        run: |
          gh workflow run scrape.yml --ref main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ⏳ Aspetta Aggiorna programmazione cinema
        run: |
          for i in {1..60}; do
            STATUS=$(gh run list --workflow scrape.yml --limit 1 --json status --jq '.[0].status')
            if [ "$STATUS" = "completed" ]; then
              echo "✅ Aggiorna programmazione cinema completato!"
              break
            fi
            echo "In attesa... tentativo $i/60"
            sleep 10
          done

      - name: ✨ Tutti i workflow completati!
        run: echo "Orchestrator terminato con successo!"
