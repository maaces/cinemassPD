name: Orchestrator

on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * *'   # 14:30 ora italiana legale (UTC+2)

permissions:
  actions: write
  contents: read

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 1. Aspetta eventuale pages-build-deployment in corso
        run: |
          for i in $(seq 1 60); do
            A=$(gh run list --workflow pages-build-deployment --status in_progress --json databaseId --jq length || echo 0)
            B=$(gh run list --workflow pages-build-deployment --status queued --json databaseId --jq length || echo 0)
            if [ "${A:-0}" = "0" ] && [ "${B:-0}" = "0" ]; then
              echo "Nessun pages-build-deployment in corso."
              exit 0
            fi
            echo "pages-build-deployment in corso... ($i/60)"
            sleep 10
          done
          echo "Timeout in attesa di pages-build-deployment"; exit 1

      - name: 2. Lancia "Controlla nuovi eventi personalizzati" e aspetta
        run: |
          START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run check-events.yml --ref main
          ID=""
          for i in $(seq 1 30); do
            ID=$(gh run list --workflow check-events.yml --event workflow_dispatch --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$START\")][0].databaseId")
            if [ -n "$ID" ] && [ "$ID" != "null" ]; then break; fi
            sleep 5
          done
          [ -n "$ID" ] && [ "$ID" != "null" ] || { echo "Run non trovata"; exit 1; }
          gh run watch "$ID" --exit-status

      - name: 3. Lancia "Aggiorna programmazione cinema" e aspetta
        run: |
          START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run scrape.yml --ref main
          ID=""
          for i in $(seq 1 30); do
            ID=$(gh run list --workflow scrape.yml --event workflow_dispatch --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$START\")][0].databaseId")
            if [ -n "$ID" ] && [ "$ID" != "null" ]; then break; fi
            sleep 5
          done
          [ -n "$ID" ] && [ "$ID" != "null" ] || { echo "Run non trovata"; exit 1; }
          gh run watch "$ID" --exit-status
